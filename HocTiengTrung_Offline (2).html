<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung - Mẹo Ghi Nhớ Theo Bộ Thủ</title>
    <style>
    /* Offline: dùng system fonts thay Google Fonts */
    </style>
    <style>
:root {
    --primary: #D32F2F; /* Chinese Red */
    --primary-light: #FF6659;
    --primary-dark: #9A0007;
    --bg-color: #F8F9FA;
    --card-bg: #FFFFFF;
    --text-main: #2C3E50;
    --text-muted: #7F8C8D;
    --accent: #F1C40F; /* Gold */
    --border: #E0E0E0;
    --sidebar-bg: #1A1A2E;
    --sidebar-text: #EAEAEA;
    --sidebar-hover: #262640;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* Chinese Characters Font */
.hanzi {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'SimSun', sans-serif;
}

.app-container {
    display: flex;
    width: 100%;
    height: 100%;
}

/* Sidebar */
.sidebar {
    width: 320px;
    background-color: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 15px rgba(0,0,0,0.1);
    z-index: 10;
}

.sidebar-header {
    padding: 30px 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
}

.sidebar-header i {
    color: var(--primary);
}

.sidebar-header p {
    font-size: 0.85rem;
    color: #a0a0b5;
}

.upload-box {
    padding: 15px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.upload-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    background: rgba(211, 47, 47, 0.15);
    color: var(--primary-light);
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.3s;
    border: 1px dashed rgba(211, 47, 47, 0.3);
}

.upload-btn:hover {
    background: var(--primary);
    color: white;
    border: 1px solid var(--primary);
}

.search-box {
    padding: 20px;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.search-box input {
    width: 100%;
    padding: 12px 15px 12px 40px;
    border-radius: 8px;
    border: none;
    background-color: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s;
}

.search-box input:focus {
    background-color: rgba(255,255,255,0.15);
    box-shadow: 0 0 0 2px var(--primary);
}

.search-box i {
    position: absolute;
    left: 35px;
    top: 50%;
    transform: translateY(-50%);
    color: #a0a0b5;
}

.radical-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
}

.radical-list::-webkit-scrollbar {
    width: 6px;
}
.radical-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
}

.radical-item {
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 4px solid transparent;
    border-bottom: 1px solid rgba(255,255,255,0.03);
}

.radical-item:hover {
    background-color: var(--sidebar-hover);
}

.radical-item.active {
    background-color: var(--sidebar-hover);
    border-left-color: var(--primary);
    position: relative;
}

.radical-item.active::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border-width: 8px 8px 8px 0;
    border-style: solid;
    border-color: transparent var(--bg-color) transparent transparent;
}

.radical-char {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-light);
    width: 30px;
    text-align: center;
}

.radical-info {
    display: flex;
    flex-direction: column;
}

.radical-pinyin {
    font-size: 0.8rem;
    color: var(--accent);
    margin-bottom: 2px;
}

.radical-meaning {
    font-size: 0.95rem;
    font-weight: 500;
}

.sidebar-footer {
    padding: 15px;
    text-align: center;
    font-size: 0.8rem;
    color: #a0a0b5;
    border-top: 1px solid rgba(255,255,255,0.1);
}

/* Main Content */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-color);
    overflow-y: auto;
    position: relative;
}

.main-content::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(211,47,47,0.03) 0%, transparent 70%);
    pointer-events: none;
}

.main-header {
    padding: 40px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
}

.header-info {
    width: 100%;
}

.header-info h2 {
    font-size: 2rem;
    color: var(--text-main);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.header-info h2 span.hanzi {
    color: var(--primary);
    font-size: 2.5rem;
    background: -webkit-linear-gradient(45deg, var(--primary-dark), var(--primary-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-info p {
    color: var(--text-muted);
    font-size: 1.1rem;
}

/* HSK Filters */
.hsk-filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}

.hsk-filters.visible {
    opacity: 1;
    pointer-events: all;
}

.hsk-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    outline: none;
}

.hsk-btn:hover {
    border-color: var(--primary-light);
    color: var(--primary);
    transform: translateY(-2px);
}

.hsk-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 10px rgba(211,47,47,0.2);
}

.cards-grid {
    padding: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
}

/* Flashcard Styles */
.flashcard {
    background-color: transparent;
    border-radius: 20px;
    perspective: 1000px;
    height: 400px;
    cursor: pointer;
}

.flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    box-shadow: var(--shadow);
    border-radius: 20px;
}

.flashcard:hover .flashcard-inner {
    box-shadow: 0 15px 35px rgba(211, 47, 47, 0.1);
    transform: translateY(-5px);
}

.flashcard.is-flipped .flashcard-inner {
    transform: rotateY(180deg) scale(1.02);
}

.flashcard-front, .flashcard-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: var(--card-bg);
}

.flashcard-front {
    z-index: 2;
    border: 1px solid var(--border);
}

.flashcard-front::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.flashcard:hover .flashcard-front::after {
    opacity: 1;
}

.flashcard-back {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, #ffffff 0%, #fff5f5 100%);
    border: 1px solid rgba(211,47,47,0.2);
    border-top: 5px solid var(--primary);
}

/* Front Content */
.vocab-hsk-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--accent);
    color: var(--primary-dark);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.speak-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(211, 47, 47, 0.05);
    color: var(--primary);
    border: 1px solid rgba(211, 47, 47, 0.15);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 10;
    font-size: 1.1rem;
}

.speak-btn:hover {
    background: var(--primary);
    color: white;
    transform: scale(1.1);
    box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
}

.flashcard-back .vocab-hsk-badge {
    background: var(--primary-light);
    color: white;
}

.vocab-char {
    font-size: 6rem;
    color: var(--primary);
    margin-bottom: 10px;
    line-height: 1;
    text-shadow: 2px 2px 0px rgba(211,47,47,0.1);
}

.vocab-pinyin {
    font-size: 1.5rem;
    color: var(--text-muted);
    margin-bottom: 25px;
    letter-spacing: 1px;
    font-weight: 500;
}

.vocab-meaning {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-main);
    padding: 12px 25px;
    background-color: rgba(248, 249, 250, 0.8);
    border-radius: 30px;
    border: 1px solid var(--border);
    transition: all 0.3s;
}

.flashcard:hover .vocab-meaning {
    background-color: #fff;
    border-color: rgba(211,47,47,0.2);
}

.flip-hint {
    margin-top: auto;
    font-size: 0.9rem;
    color: var(--primary-light);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.8;
    background: rgba(211,47,47,0.05);
    padding: 8px 15px;
    border-radius: 20px;
}

/* Back Content (Mnemonic) */
.mnemonic-icon {
    font-size: 3rem;
    color: var(--accent);
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 6px rgba(241, 196, 15, 0.3));
}

.mnemonic-title {
    font-size: 1.15rem;
    color: var(--primary-dark);
    font-weight: 700;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.mnemonic-text {
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--text-main);
    padding: 0 10px;
}

.mnemonic-text .hanzi {
    color: var(--primary);
    font-weight: 700;
    font-size: 1.3rem;
    background: rgba(211,47,47,0.05);
    padding: 2px 6px;
    border-radius: 4px;
}

/* Empty State */
.empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    text-align: center;
    color: var(--text-muted);
}

.empty-state i {
    font-size: 5rem;
    color: #e0e0e0;
    margin-bottom: 25px;
}

.empty-state p {
    font-size: 1.25rem;
}

/* Animation for rendering cards */
@keyframes fadeInSlideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.vocab-card-animate {
    animation: fadeInSlideUp 0.4s ease forwards;
}

/* Responsive Mobile */
@media (max-width: 768px) {
    body {
        overflow: auto;
        height: 100%;
    }

    .app-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
    }

    /* Mobile tab bar */
    .mobile-tabs {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--sidebar-bg);
        border-bottom: 2px solid rgba(255,255,255,0.1);
    }

    .mobile-tab-btn {
        flex: 1;
        padding: 14px 10px;
        background: transparent;
        border: none;
        color: #a0a0b5;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border-bottom: 3px solid transparent;
    }

    .mobile-tab-btn.active {
        color: var(--primary-light);
        border-bottom-color: var(--primary-light);
        background: rgba(255,255,255,0.05);
    }

    /* Sidebar hidden by default on mobile */
    .sidebar {
        width: 100%;
        height: auto;
        max-height: none;
        box-shadow: none;
        display: none;
    }

    .sidebar.mobile-visible {
        display: flex;
        flex-direction: column;
    }

    .sidebar-header {
        padding: 16px 20px;
    }

    .radical-list {
        max-height: 60vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Main content shown by default */
    .main-content {
        display: block;
    }

    .main-content.mobile-hidden {
        display: none;
    }

    .radical-item.active::after {
        display: none;
    }

    .main-header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }

    .hsk-filters {
        flex-wrap: wrap;
        gap: 6px;
    }

    .hsk-btn {
        padding: 6px 10px;
        font-size: 0.8rem;
    }

    .cards-grid {
        padding: 16px;
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .flashcard {
        height: 320px;
    }
}

/* Desktop: hide mobile tabs */
@media (min-width: 769px) {
    .mobile-tabs {
        display: none;
    }
    .sidebar {
        display: flex !important;
    }
    .main-content {
        display: flex !important;
    }
}

    <script>
    /* Minimal PapaParse compatible CSV parser - offline version */
    var Papa = {
        parse: function(file, config) {
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var text = e.target.result;
                    var lines = text.split(/\r?\n/);
                    if (lines.length === 0) { config.complete({data:[]}); return; }
                    
                    // Parse headers
                    var headers = Papa._parseLine(lines[0]);
                    var data = [];
                    
                    for (var i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        var vals = Papa._parseLine(lines[i]);
                        var row = {};
                        headers.forEach(function(h, idx) {
                            row[h] = vals[idx] !== undefined ? vals[idx] : '';
                        });
                        data.push(row);
                    }
                    config.complete({ data: data });
                } catch(err) {
                    if (config.error) config.error(err);
                }
            };
            reader.onerror = function() {
                if (config.error) config.error(new Error('Không đọc được file'));
            };
            reader.readAsText(file, 'UTF-8');
        },
        _parseLine: function(line) {
            var result = [], cur = '', inQ = false;
            for (var i = 0; i < line.length; i++) {
                var c = line[i];
                if (c === '"') {
                    if (inQ && line[i+1] === '"') { cur += '"'; i++; }
                    else inQ = !inQ;
                } else if (c === ',' && !inQ) {
                    result.push(cur); cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result;
        }
    };
    </script>

    <script>
const radicalsData = [
    {
        id: "r1", character: "亻", pinyin: "rén", meaning: "Nhân (người)",
        vocabularies: [

            { character: "他", pinyin: "tā", meaning: "Anh ấy, ông ấy", hsk: 1, mnemonic: "Người (亻) kia cũng (也) là anh ấy (他)." },
            { character: "们", pinyin: "men", meaning: "Các, những (số nhiều)", hsk: 1, mnemonic: "Nhiều người (亻) đứng trước cửa (门) tạo thành số nhiều (们)." },

            { character: "休", pinyin: "xiū", meaning: "Nghỉ ngơi", hsk: 2, mnemonic: "Người (亻) tựa vào cái cây (木) để nghỉ ngơi (休)." },
            { character: "伴", pinyin: "bàn", meaning: "Bạn, bầu bạn", hsk: 3, mnemonic: "Người (亻) chia sẻ một nửa (半) với mình chính là người bầu bạn (伴)." },
            { character: "健", pinyin: "jiàn", meaning: "Khỏe mạnh", hsk: 3, mnemonic: "Người (亻) xây dựng (建) cơ thể khỏe mạnh (健)." },

            { character: "促", pinyin: "cù", meaning: "Thúc đẩy, giục", hsk: 5, mnemonic: "Người (亻) dùng chân (足) đá thúc đẩy (促) công việc." },
            { character: "佩", pinyin: "pèi", meaning: "Đeo, khâm phục", hsk: 5, mnemonic: "Người (亻) mặc áo có dải lụa (凡) và đeo khăn (巾) rất đáng khâm phục (佩)." }

    {

    <script>
document.addEventListener('DOMContentLoaded', () => {
    const radicalListEl = document.getElementById('radicalList');
    const searchRadicalInput = document.getElementById('searchRadical');
    const vocabCardsEl = document.getElementById('vocabCards');
    const currentRadicalNameEl = document.getElementById('currentRadicalName');
    const currentRadicalMeaningEl = document.getElementById('currentRadicalMeaning');
    const hskFiltersEl = document.getElementById('hskFilters');
    const hskBtns = document.querySelectorAll('.hsk-btn');
    const csvUpload = document.getElementById('csvUpload');

    let currentActiveId = null;
    let currentVocabularies = [];
    let currentHskFilter = 'all';

    // Initialize application
    function init() {
        if (typeof rawCsvData !== 'undefined') {
            Papa.parse(rawCsvData, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processCSVData(results.data, true);
                }
            });
        } else {
            renderRadicals(radicalsData);
            if (radicalsData.length > 0) {
                selectRadical(radicalsData[0].id);
            }
        }
        
        setupSearch();
        setupHskFilters();
        setupCSVUpload();
    }

    // Handle CSV upload
    function setupCSVUpload() {
        csvUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Optional: reset file input to allow uploading the same file again if needed
            const reader = new FileReader();

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processCSVData(results.data);
                    // Reset input
                    csvUpload.value = '';
                },
                error: function(err) {
                    alert('Có lỗi khi tải file: ' + err.message);
                }
            });
        });
    }

    function processCSVData(rows, isSilent = false) {
        let addedCount = 0;
        
        rows.forEach(row => {
            // Lấy key các cột do file CSV có thể bị thừa dấu cách
            const keys = Object.keys(row);
            const getVal = (possibleNames) => {
                const lowerNames = possibleNames.map(n => n.toLowerCase());
                for (let k of keys) {
                    if (lowerNames.includes(k.trim().toLowerCase())) return row[k];
                }
                return null;
            };

            const radChar = getVal(['Bộ Thủ'])?.trim() || "⭐";
            const radPinyin = getVal(['Pinyin Bộ Thủ'])?.trim() || "";
            const radMeaning = getVal(['Nghĩa Bộ Thủ'])?.trim() || "Tất cả từ vựng (Nhập từ CSV)";
            
            const vocabChar = getVal(['Từ Vựng', 'HÁN TỰ'])?.trim();
            const vocabPinyin = getVal(['Pinyin Từ Vựng', 'PINYIN'])?.trim() || "";
            const vocabMeaning = getVal(['Nghĩa Từ Vựng', 'NGHĨA TIẾNG VIỆT', 'TIẾNG VIỆT'])?.trim() || "";
            const hsk = getVal(['HSK'])?.trim() || "0";
            const hanviet = getVal(['HÁN VIỆT'])?.trim() || "";
            const rawMnemonic = getVal(['Mẹo Ghi Nhớ'])?.trim() || "";
            const mnemonic = rawMnemonic || (hanviet ? `Hán Việt: ${hanviet}` : "Chưa có mẹo ghi nhớ");
            
            if (!vocabChar) return;

            let radical = radicalsData.find(r => r.character === radChar);
            if (!radical) {
                radical = {
                    id: 'r_csv_' + Date.now() + Math.random().toString(36).substr(2, 5),
                    character: radChar,
                    pinyin: radPinyin,
                    meaning: radMeaning,
                    vocabularies: []
                };
                radicalsData.push(radical);
            }

            if (!radical.vocabularies.find(v => v.character === vocabChar)) {
                radical.vocabularies.push({
                    character: vocabChar,
                    pinyin: vocabPinyin,
                    meaning: vocabMeaning,
                    hsk: parseInt(hsk, 10),
                    mnemonic: mnemonic
                });
                addedCount++;
            }
        });

        if (!isSilent) {
            alert(`Tải lên thành công! Đã thêm mới ${addedCount} từ vựng từ file CSV.`);
        }
        
        currentActiveId = null;
        renderRadicals(radicalsData);
        if (radicalsData.length > 0) {
            selectRadical(radicalsData[radicalsData.length - 1].id); // Mở ngay bộ thủ vừa thêm
        }
    }

    // Render the sidebar list of radicals
    function renderRadicals(data) {
        radicalListEl.innerHTML = '';
        
        if (data.length === 0) {
            radicalListEl.innerHTML = '<li style="padding: 20px; text-align: center; color: #7F8C8D;">Không tìm thấy bộ thủ nào.</li>';
            return;
        }

        data.forEach(radical => {
            const li = document.createElement('li');
            li.className = `radical-item ${radical.id === currentActiveId ? 'active' : ''}`;
            li.dataset.id = radical.id;
            
            li.innerHTML = `
                <div class="radical-char hanzi">${radical.character}</div>
                <div class="radical-info">
                    <span class="radical-pinyin">${radical.pinyin}</span>
                    <span class="radical-meaning">${radical.meaning}</span>
                </div>
            `;
            
            li.addEventListener('click', () => selectRadical(radical.id));
            radicalListEl.appendChild(li);
        });
    }

    // Search functionality
    function setupSearch() {
        searchRadicalInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = radicalsData.filter(r => 
                r.meaning.toLowerCase().includes(term) || 
                r.character.includes(term) ||
                r.pinyin.toLowerCase().includes(term)
            );
            renderRadicals(filtered);
        });
    }

    // HSK Filters setup
    function setupHskFilters() {
        hskBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button state
                hskBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Update current filter and re-render cards
                currentHskFilter = btn.dataset.hsk;
                renderVocabularies();
            });
        });
    }

    // Handle selecting a radical
    function selectRadical(id) {
        if (currentActiveId === id) return; // Prevent re-rendering same radical
        
        currentActiveId = id;
        
        // Update UI selection
        const allItems = document.querySelectorAll('.radical-item');
        allItems.forEach(item => {
            if (item.dataset.id === id) {
                item.classList.add('active');
                // Scroll into view if needed
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });

        // Get radical data
        const radical = radicalsData.find(r => r.id === id);
        if (!radical) return;

        // Reveal HSK filters
        hskFiltersEl.classList.add('visible');

        // Update header
        currentRadicalNameEl.innerHTML = `<span class="hanzi">${radical.character}</span> Bộ ${radical.meaning.split('(')[0].trim()}`;
        currentRadicalMeaningEl.textContent = `Pinyin: ${radical.pinyin} | ${radical.meaning}`;

        // Store current vocabularies and render
        currentVocabularies = radical.vocabularies;
        renderVocabularies();

        // Auto switch to flashcard tab on mobile
        if (window.innerWidth <= 768) {
            switchTab('flashcard');
        }
    }

    // Render flashcards based on radical and HSK filter
    function renderVocabularies() {
        vocabCardsEl.innerHTML = '';

        // Filter based on HSK selection
        let filteredVocab = currentVocabularies;
        if (currentHskFilter !== 'all') {
            filteredVocab = currentVocabularies.filter(v => v.hsk == currentHskFilter);
        }

        if (filteredVocab.length === 0) {
            vocabCardsEl.innerHTML = `
                <div class="empty-state">
                    <span class="icon" style="font-size:3rem;">📂</span>
                    <p>Không có từ vựng nào thuộc cấp độ HSK này trong bộ thủ được chọn.</p>
                </div>
            `;
            return;
        }

        filteredVocab.forEach((vocab, index) => {
            const card = document.createElement('div');
            card.className = 'flashcard vocab-card-animate';
            card.style.animationDelay = `${index * 0.05}s`; // Staggered animation faster
            
            const hskBadge = vocab.hsk ? `<div class="vocab-hsk-badge">HSK ${vocab.hsk}</div>` : '';

            card.innerHTML = `
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        ${hskBadge}
                        <button class="speak-btn" aria-label="Phát âm tiếng Trung" title="Phát âm">
                            <span class="icon">🔊</span>
                        </button>
                        <div class="vocab-char hanzi">${vocab.character}</div>
                        <div class="vocab-pinyin">${vocab.pinyin}</div>
                        <div class="vocab-meaning">${vocab.meaning}</div>
                        <div class="flip-hint">
                            <span class="icon">🔄</span> Nhấp xem mẹo ghi nhớ
                        </div>
                    </div>
                    <div class="flashcard-back">
                        ${hskBadge}
                        <span class="icon mnemonic-icon" style="font-size:2rem;">💡</span>
                        <h3 class="mnemonic-title">Mẹo Ghi Nhớ</h3>
                        <p class="mnemonic-text">${highlightHanzi(vocab.mnemonic)}</p>
                    </div>
                </div>
            `;

            // Flip interaction and pronunciation
            card.addEventListener('click', (e) => {
                const speakBtn = e.target.closest('.speak-btn');
                if (speakBtn) {
                    // Canceled bubbling and flip, just speak
                    e.stopPropagation();
                    speakChinese(vocab.character);
                    return;
                }
                card.classList.toggle('is-flipped');
            });

            vocabCardsEl.appendChild(card);
        });
    }

    // Helper: Highlight Chinese characters in the mnemonic text
    function highlightHanzi(text) {
        // Matches characters inside parentheses like: (亻) or (Thủy) and wraps them
        return text.replace(/\((.*?)\)/g, '(<span class="hanzi">$1</span>)');
    }

    // Pronunciation Feature
    function speakChinese(text) {
        if ('speechSynthesis' in window) {
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85; // Slightly slower for learning purposes
            
            window.speechSynthesis.speak(utterance);
        } else {
            console.warn('Speech Synthesis API is not supported in this browser.');
        }
    }

    // Mobile tab switching
    function switchTab(tab) {
        const sidebar = document.getElementById('sidebarEl');
        const main = document.getElementById('mainContentEl');
        const tabBotThu = document.getElementById('tabBotThu');
        const tabFlashcard = document.getElementById('tabFlashcard');

        if (tab === 'bothu') {
            sidebar.classList.add('mobile-visible');
            main.classList.add('mobile-hidden');
            tabBotThu.classList.add('active');
            tabFlashcard.classList.remove('active');
        } else {
            sidebar.classList.remove('mobile-visible');
            main.classList.remove('mobile-hidden');
            tabFlashcard.classList.add('active');
            tabBotThu.classList.remove('active');
        }
    }
    window.switchTab = switchTab;

    // Start app
    init();
});

</script>
</body>
</html>
